<div class="page">
  <a class="back" routerLink="/admin-panel">← Painel de Admin</a>
  <h1 class="page-title">Departamentos</h1>
  <div class="toolbar">
    <div class="search">
      <input type="text" placeholder="Pesquisar departamento" [(ngModel)]="searchText" (input)="applyFilter()" />
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="7"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>
    </div>
    <button class="btn btn-primary" type="button" (click)="showNewDepartmentForm =! showNewDepartmentForm">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="12" y1="5" x2="12" y2="19"></line>
        <line x1="5" y1="12" x2="19" y2="12"></line>
      </svg>
      Criar Departamento
    </button>
  </div>
  @if (showNewDepartmentForm) {
    <div class="create-form">
      <label class="create-form-label" for="newDepartmentName">Novo departamento</label>
      <div class="create-form-row">
        <input
          id="newDepartmentName"
          [(ngModel)]="NewDepartmentName"
          name="newDepartmentName"
          placeholder="Nome do departamento"
          (keyup.enter)="createDepartment()"
        />
        <button class="btn btn-primary" type="button" (click)="createDepartment()">Criar</button>
        <button class="btn btn-ghost" type="button" (click)="showNewDepartmentForm = false">Cancelar</button>
      </div>
    </div>
  }
  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>Departamento</th>
          <th>Utilizadores</th>
        </tr>
      </thead>
      <tbody>
        @for (dept of pagedItems; track dept.id) {
        <tr>
          <td>{{ dept.name }}</td>
          <td>{{ dept.nr_users }}</td>
        </tr>
        } @empty {
        <tr><td colspan="2">Não foram encontrados registos.</td></tr>
        }
      </tbody>
    </table>
  </div>
  @if (totalPages > 1) {
  <div class="pagination">
    <button [disabled]="page === 1" (click)="page = page - 1">Anterior</button>
    <span>Página {{ page }} de {{ totalPages }}</span>
    <button [disabled]="page === totalPages" (click)="page = page + 1">Seguinte</button>
  </div>
  }
</div>
